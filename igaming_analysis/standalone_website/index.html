      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231a6b73'/%3E%3C/svg%3E"
    />
    <script>
      (function bootstrapVDHTheme() {
        const THEME_PARAM_KEY = 'theme';
        const THEME_COOKIE_KEY = 'vdh_theme';
        const THEME_STORAGE_KEY = 'vdh_theme';
        const LEGACY_STORAGE_KEYS = [
          'vantage-theme',
          'vdh_iran2_theme',
          'vdh_ice2_theme',
          'vdh_trump_theme',
          'vdh_louisiana_us_senate_test_ballot_theme',
          'vdh_louisiana_us_senate_favorability_theme',
          'vdh_louisiana_us_senate_test_ballot_re_ask_theme',
          'vdh_louisiana_us_senate_state_perception_theme',
          'vdh_louisiana_us_senate_top_priority_issue_trust_theme',
          'vdh_louisiana_us_senate_ideology_theme',
          'vdh_louisiana_us_senate_voter_flows_theme'
        ];

        function normalizeTheme(value) {
          return value === 'dark' || value === 'light' ? value : null;
        }

        function readThemeFromQuery() {
          try {
            const params = new URLSearchParams(window.location.search || '');
            return normalizeTheme(params.get(THEME_PARAM_KEY));
          } catch (err) {
            return null;
          }
        }

        function readThemeFromCookie() {
          try {
            const entries = String(document.cookie || '').split(';');
            for (const entry of entries) {
              const trimmed = entry.trim();
              if (!trimmed) continue;
              const idx = trimmed.indexOf('=');
              if (idx <= 0) continue;
              const key = trimmed.slice(0, idx).trim();
              if (key !== THEME_COOKIE_KEY) continue;
              const value = decodeURIComponent(trimmed.slice(idx + 1));
              const normalized = normalizeTheme(value);
              if (normalized) return normalized;
            }
          } catch (err) {}
          return null;
        }

        function readThemeFromStorage() {
          const keys = [THEME_STORAGE_KEY, ...LEGACY_STORAGE_KEYS];
          for (const key of keys) {
            try {
              const normalized = normalizeTheme(window.localStorage.getItem(key));
              if (normalized) return normalized;
            } catch (err) {}
          }
          return null;
        }

        function readThemeFromSystem() {
          try {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              return 'dark';
            }
            if (window.matchMedia) return 'light';
          } catch (err) {}
          return null;
        }

        function resolveInitialTheme() {
          const fromQuery = readThemeFromQuery();
          if (fromQuery) return { theme: fromQuery, source: 'param' };

          const fromCookie = readThemeFromCookie();
          if (fromCookie) return { theme: fromCookie, source: 'cookie' };

          const fromStorage = readThemeFromStorage();
          if (fromStorage) return { theme: fromStorage, source: 'storage' };

          const fromSystem = readThemeFromSystem();
          if (fromSystem) return { theme: fromSystem, source: 'system' };

          return { theme: 'light', source: 'fallback' };
        }

        function isPhilippDomain(hostname) {
          const host = String(hostname || '').toLowerCase();
          return host === 'philippbroniecki.com' || host.endsWith('.philippbroniecki.com');
        }

        function getSharedCookieDomain() {
          return isPhilippDomain(window.location.hostname) ? '.philippbroniecki.com' : '';
        }

        function persistTheme(theme) {
          const normalized = normalizeTheme(theme);
          if (!normalized) return;

          const securePart = window.location.protocol === 'https:' ? '; Secure' : '';
          const baseCookie = `${THEME_COOKIE_KEY}=${encodeURIComponent(normalized)}; Path=/; Max-Age=31536000; SameSite=Lax${securePart}`;
          const sharedDomain = getSharedCookieDomain();

          try {
            if (sharedDomain) {
              document.cookie = `${baseCookie}; Domain=${sharedDomain}`;
            }
            document.cookie = baseCookie;
          } catch (err) {}

          const keys = [THEME_STORAGE_KEY, ...LEGACY_STORAGE_KEYS];
          for (const key of keys) {
            try {
              window.localStorage.setItem(key, normalized);
            } catch (err) {}
          }
        }

        function shouldPropagateThemeToURL(url, rawHref) {
          const raw = String(rawHref || '').trim();
          if (!raw || raw.startsWith('#') || /^mailto:/i.test(raw) || /^tel:/i.test(raw) || /^javascript:/i.test(raw)) {
            return false;
          }

          const protocol = String((url && url.protocol) || '').toLowerCase();
          if (protocol === 'file:') return true;
          if (protocol !== 'http:' && protocol !== 'https:') return false;

          const host = String((url && url.hostname) || '').toLowerCase();
          if (host === 'localhost' || host === '127.0.0.1' || host === '[::1]') return true;
          return isPhilippDomain(host);
        }

        function withThemeParam(rawHref, theme) {
          const normalizedTheme = normalizeTheme(theme);
          if (!normalizedTheme) return rawHref;

          try {
            const url = new URL(rawHref, window.location.href);
            if (!shouldPropagateThemeToURL(url, rawHref)) return rawHref;
            url.searchParams.set(THEME_PARAM_KEY, normalizedTheme);
            return url.toString();
          } catch (err) {
            return rawHref;
          }
        }

        function getActiveTheme() {
          return normalizeTheme(document.documentElement.getAttribute('data-theme')) || 'light';
        }

        window.VDHTheme = {
          normalizeTheme,
          resolveInitialTheme,
          persistTheme,
          withThemeParam,
          getActiveTheme,
          shouldPropagateThemeToURL,
          themeParamKey: THEME_PARAM_KEY
        };

        const initialTheme = resolveInitialTheme();
        document.documentElement.setAttribute('data-theme', initialTheme.theme);
        window.__VDH_THEME_BOOT__ = initialTheme;
      })();
    </script>

      }

        margin: 1.2rem 0 1.35rem;

      }

      tr:last-child td {

      }

      tr.separator-row td {
        padding: 0.5rem 1rem;

      th {

        color: var(--ink-soft);

      .figure-block {
        margin: 1.3rem 0 1.5rem;
        padding: 1.1rem;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--surface-soft);
      }

      .figure-grid {
        display: grid;
        gap: 1rem;
      }

      .figure-stack {
        display: grid;
        gap: 1rem;
      }

      .figure-embed-shell {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
      }

      .figure-embed-frame {
        display: block;
        width: 100%;
        min-height: 360px;
        border: 0;
        background: transparent;
      }

      .figure-grid.two-up {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .figure-card {
        padding: 1rem;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);

      .figure-card h4 {

      .matchup-row {
        grid-template-columns: minmax(0, 1.45fr) minmax(0, 2.2fr);

      .meter-row:last-child,
      .matchup-row:last-child {

        grid-template-columns: minmax(0, 1fr) auto;

      .diverging-list {

        display: grid;

      .diverging-track {
        position: relative;
        height: 1rem;

      .diverging-track::after {
        content: '';

        bottom: 0;

        width: 1px;
        background: color-mix(in srgb, var(--line-strong) 70%, transparent 30%);

      .diverging-fill {
        position: absolute;

        bottom: 0;

        gap: 0.9rem;

        font-size: 0.94rem;
        color: var(--ink);

      .lollipop-track {

        min-height: 1.6rem;

      .lollipop-baseline {
        position: absolute;
        left: 0;
        top: 50%;
        height: 2px;
        background: color-mix(in srgb, var(--line-strong) 72%, transparent 28%);
        transform: translateY(-50%);

      .lollipop-dot {
        position: absolute;
        top: 50%;
        width: 0.92rem;
        height: 0.92rem;
        border-radius: 999px;
        transform: translate(-50%, -50%);
        background: var(--accent);
        border: 2px solid var(--surface);
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--line-strong) 75%, transparent 25%);
      }

      .lollipop-value {
        position: absolute;
        top: 50%;
        transform: translate(0, -50%);
        font-size: 0.85rem;
        color: var(--ink);
        white-space: nowrap;
      }

          padding: 0 0.85rem;

          border-radius: 22px;

        .report-paragraph,
        .report-list,
        .report-quote,
        .report-table-wrap table {
          font-size: 1.04rem;
          line-height: 1.72;
        }

        .comparison-row,
        .meter-row,
        .matchup-row,
        .diverging-row,
        .lollipop-row {
          grid-template-columns: 1fr;
          gap: 0.45rem;
        }

        .meter-value {
          justify-self: start;
        }
      }
    </style>

      let reportData = FALLBACK_REPORT;

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function renderInlineMarkdown(value) {
        let html = escapeHtml(value == null ? '' : value);
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        html = html.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/(^|[\s(])\*([^*]+?)\*(?=[$\s.,;:!?)]|$)/g, '$1<em>$2</em>');
        return html;
      }

      function toArray(value) {
        return Array.isArray(value) ? value : [];
      }

      function isLocalPreviewHost() {
        if (location.protocol === 'file:') return true;
        const host = String(location.hostname || '').toLowerCase();
        return host === 'localhost' || host === '127.0.0.1' || host === '[::1]';
      }

      function normalizeSiteNavLinks(items) {
        return toArray(items)
          .map((item) => {
            const label = String(item?.label || '').trim();
            const canonicalHref = String(item?.canonical_href || item?.href || '').trim();
            const localHref = String(item?.local_href || '').trim();
            const siteSlug = String(item?.site_slug || item?.siteSlug || '').trim();
            if (!label || (!canonicalHref && !localHref)) return null;
            return { label, canonical_href: canonicalHref, local_href: localHref, site_slug: siteSlug };
          })
          .filter(Boolean);
      }

      function resolveSiblingHref(entry) {
        const canonicalHref = String(entry?.canonical_href || '').trim();
        const localHref = String(entry?.local_href || '').trim();
        if (isLocalPreviewHost() && localHref) return localHref;
        return canonicalHref || localHref;
      }

      function renderSiteNavigation() {
        const backLink = document.getElementById('backToPortalLink');
        const siblingWrap = document.getElementById('siblingNavLinks');
        if (!backLink || !siblingWrap) return;

        const navCfg = reportData?.meta?.group_navigation || {};
        const backCfg = navCfg?.back || {};
        const backHref = String(
          (isLocalPreviewHost() ? (backCfg?.local_href || '') : '') ||
          backCfg?.href ||
          backLink.getAttribute('href') ||
          ''
        ).trim();
        const backLabel = String(backCfg?.label || backLink.textContent || 'Portal').trim();
        if (backHref) backLink.href = backHref;
        backLink.textContent = backLabel || 'Portal';

        const currentSlug = String(reportData?.template?.site_slug || '').trim();
        const siblings = normalizeSiteNavLinks(navCfg?.siblings).filter((entry) => entry.site_slug !== currentSlug);
        siblingWrap.innerHTML = '';
        if (!siblings.length) {
          siblingWrap.hidden = true;
          return;
        }

        siblings.forEach((entry) => {
          const href = resolveSiblingHref(entry);
          if (!href) return;
          const link = document.createElement('a');
          link.className = 'site-nav-link';
          link.href = href;
          link.textContent = entry.label;
          siblingWrap.appendChild(link);
        });

      function applyThemeToLinks(root = document) {
        const helper = window.VDHTheme;
        if (!helper || typeof helper.withThemeParam !== 'function') return;
        const activeTheme = helper.getActiveTheme();
        const links = root.querySelectorAll('a[href]');
        links.forEach((link) => {
          const rawHref = link.getAttribute('href');
          if (!rawHref) return;
          if (String(link.getAttribute('data-skip-theme-param') || '').trim() === 'true') return;
          if (!link.dataset.rawHref) link.dataset.rawHref = rawHref;
          const themedHref = helper.withThemeParam(link.dataset.rawHref, activeTheme);
          if (themedHref) link.setAttribute('href', themedHref);
        });
      }

      function resolveTestBallotEmbedBaseUrl() {
        if (isLocalPreviewHost()) return '../../test_ballot/standalone_website/';

      function resolveTestBallotEmbedUrl() {
        const helper = window.VDHTheme;
        const activeTheme = helper?.getActiveTheme?.() || 'light';
        const rawUrl = `${resolveTestBallotEmbedBaseUrl()}?embed=statewide-comparison`;
        return helper?.withThemeParam ? helper.withThemeParam(rawUrl, activeTheme) : rawUrl;
      }

      function applyThemeToEmbeds(root = document) {
        root.querySelectorAll('iframe[data-embed-kind="test-ballot-statewide-comparison"]').forEach((frame) => {
          const nextSrc = resolveTestBallotEmbedUrl();
          if (frame.getAttribute('src') !== nextSrc) {
            frame.setAttribute('src', nextSrc);
          }
        });
      }

      function applyTheme(theme) {
        const helper = window.VDHTheme;
        const normalized = helper?.normalizeTheme ? helper.normalizeTheme(theme) : null;
        if (!normalized) return;
        document.documentElement.setAttribute('data-theme', normalized);
        helper?.persistTheme?.(normalized);
        const icon = document.getElementById('toggleIcon');
        const label = document.getElementById('toggleLabel');
        if (icon) icon.textContent = normalized === 'dark' ? '\u263D' : '\u263C';
        if (label) label.textContent = normalized === 'dark' ? 'Dark' : 'Light';
        applyThemeToLinks(document);
        applyThemeToEmbeds(document);
      }

      function initThemeControls() {
        const initialTheme = window.VDHTheme?.resolveInitialTheme?.()?.theme ||
          window.VDHTheme?.getActiveTheme?.() ||
          document.documentElement.getAttribute('data-theme') ||
          'light';
        applyTheme(initialTheme);
        const toggle = document.getElementById('themeToggle');
        if (!toggle) return;
        toggle.addEventListener('click', () => {
          const current = window.VDHTheme?.getActiveTheme?.() || 'light';
          applyTheme(current === 'dark' ? 'light' : 'dark');
        });

      async function loadReportData() {
        const banner = document.getElementById('dataBanner');

          if (!payload || typeof payload !== 'object') throw new Error('Invalid JSON payload');

          reportData = FALLBACK_REPORT;
          if (banner) {

      function normalizeHeadingId(value) {

      }

      function renderParagraphHtml(lines) {
        const source = toArray(lines);
        const parts = [];
        source.forEach((line, index) => {
          const raw = String(line == null ? '' : line);
          const cleaned = raw.replace(/\s+$/, '');
          if (!cleaned) return;
          parts.push(renderInlineMarkdown(cleaned));
          if (index < source.length - 1) {
            parts.push(/\s{2,}$/.test(raw) ? '<br>' : ' ');
          }
        });
        return parts.join('').trim();
      }

      function createTable(headers, rows) {
        const wrap = document.createElement('div');
        wrap.className = 'report-table-wrap';
        wrap.setAttribute('data-report-table', 'true');
        const table = document.createElement('table');
        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        toArray(headers).forEach((header) => {
          const th = document.createElement('th');
          th.innerHTML = renderInlineMarkdown(header);
          headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        toArray(rows).forEach((row) => {
          const tr = document.createElement('tr');
          const normalizedCells = toArray(row).map((cell) => String(cell == null ? '' : cell).trim());
          const nonEmptyCount = normalizedCells.filter(Boolean).length;
          if (nonEmptyCount === 0) {
            tr.className = 'separator-row';
          } else if (nonEmptyCount === 1 && normalizedCells[0]) {
            tr.className = 'group-row';
          }
          normalizedCells.forEach((cell) => {
            const td = document.createElement('td');
            td.innerHTML = renderInlineMarkdown(cell);
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        wrap.appendChild(table);
        return wrap;
      }

      function formatPercent(value, digits = 1) {
        const numeric = Number(value);
        if (!Number.isFinite(numeric)) return 'NA';
        return `${numeric.toFixed(digits)}%`;
      }

      function formatSignedWhole(value) {
        const numeric = Number(value);
        if (!Number.isFinite(numeric)) return 'NA';
        return `${numeric > 0 ? '+' : ''}${Math.round(numeric)}`;
      }

      function percentagePosition(value, minValue, maxValue) {

        const span = maxValue - minValue || 1;
        return ((numeric - minValue) / span) * 100;
      }

      function createStackedBarFigure(segments) {
        const wrap = document.createElement('div');
        const bar = document.createElement('div');
        bar.className = 'stacked-bar';
        toArray(segments).forEach((segment) => {
          const value = Number(segment?.value);
          if (!Number.isFinite(value) || value <= 0) return;

          piece.className = 'stacked-segment';
          piece.style.width = `${Math.max(0, value)}%`;

          bar.appendChild(piece);

      function createDivergingCard(title, rows) {
        const card = document.createElement('section');
        card.className = 'figure-card';
        if (title) {
          const heading = document.createElement('h4');
          heading.textContent = title;
          card.appendChild(heading);

        const list = document.createElement('div');
        list.className = 'diverging-list';
        const max = Math.max(
          1,
          ...toArray(rows).flatMap((row) => [Math.abs(Number(row?.agree || 0)), Math.abs(Number(row?.disagree || 0))])

          const stat = document.createElement('span');

          stat.textContent = `${formatPercent(agree, 0)} / ${formatPercent(disagree, 0)}`;
          item.appendChild(stat);
          list.appendChild(item);

      function createMatchupCard(rows) {

          [

            bars.appendChild(track);
          });
          matchup.appendChild(bars);
          card.appendChild(matchup);
        });
        return card;

      function scoreToColor(value, minValue, maxValue) {
        const low = [228, 200, 179];
        const high = [26, 107, 115];
        const fallback = 'rgb(208, 216, 224)';
        const numeric = Number(value);
        if (!Number.isFinite(numeric)) return fallback;
        const span = maxValue - minValue || 1;
        const t = Math.max(0, Math.min(1, (numeric - minValue) / span));
        const rgb = high.map((channel, index) => {
          const start = low[index];
          return Math.round(start + (channel - start) * t);
        });
        return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
      }

      async function injectSvgMap(hostId, path, selector, colorLookup, ariaLabel) {
        const host = document.getElementById(hostId);
        if (!host) return;
        try {
          const response = await fetch(path, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          host.innerHTML = await response.text();
          const svg = host.querySelector('svg');
          if (svg && ariaLabel) svg.setAttribute('aria-label', ariaLabel);
          const values = Object.values(colorLookup).map((entry) => Number(entry?.value)).filter(Number.isFinite);
          const minValue = values.length ? Math.min(...values) : 0;
          const maxValue = values.length ? Math.max(...values) : 100;
          host.querySelectorAll(selector).forEach((node) => {
            const id = node.id || '';
            const key = id.replace(/^cr_/, '').replace(/^parish-/, '');
            const entry = colorLookup[key];
            if (!entry) return;
            node.style.fill = scoreToColor(entry.value, minValue, maxValue);
            node.setAttribute('title', `${entry.label}: ${formatPercent(entry.value)}`);
          });
        } catch (err) {
          host.textContent = 'Map unavailable.';
        }
      }

        card.appendChild(shell);
        pendingAsyncWork.push(
          injectSvgMap(hostId, 'data/igaming_louisiana_parish_map.svg', '[id^="parish-"]', values, 'Louisiana parish support map')
        );
        return card;
      }

      function createLollipopList(rows, options = {}) {
        const minValue = Number.isFinite(options.min) ? options.min : 0;

          item.appendChild(label);

          const track = document.createElement('div');
          track.className = 'lollipop-track';
          const position = percentagePosition(row?.value, minValue, maxValue);
          const baseline = document.createElement('div');
          baseline.className = 'lollipop-baseline';
          baseline.style.width = `${Math.max(0, position ?? 0)}%`;
          track.appendChild(baseline);

          if (position !== null) {
            const dot = document.createElement('div');
            dot.className = 'lollipop-dot';
            dot.style.left = `${position}%`;
            track.appendChild(dot);

            const value = document.createElement('div');
            value.className = 'lollipop-value';
            value.style.left = `calc(${position}% + 0.65rem)`;
            value.textContent = options.valueFormatter ? options.valueFormatter(row.value, row) : String(row.value);
            track.appendChild(value);
          }
          item.appendChild(track);
          wrap.appendChild(item);
        });
        return wrap;
      }

      function renderFigureBlock(block, nextBlock) {
        const shell = createFigureShell(block?.marker || '');
        const figures = reportData?.figures || {};
        const key = String(block?.figure_key || '');

        if (key === 'test_ballot_statewide_comparison_chart') {
          return createTestBallotEmbedFigure();
        }

        if (key === 'favorability_ranking') {
          const breakdown = document.createElement('section');
          breakdown.className = 'figure-card';
          breakdown.appendChild(createStackedBarFigure(figures?.favorability?.breakdown));
          breakdown.appendChild(
            createCompactValueList(
              figures?.favorability?.breakdown,
              (row) => formatPercent(row?.value, 1)
            )
          );
          shell.body.appendChild(breakdown);
          shell.body.appendChild(
            createLollipopList(
              toArray(figures?.favorability?.ranking).map((row) => ({ label: row.title, value: Number(row.net) })),
              {
                min: 0,
                max: 42,
                valueFormatter: (value) => formatSignedWhole(value)
              }
            )
          );
          return shell.section;
        }

        if (key === 'support_overview_map') {
          const topline = document.createElement('section');
          topline.className = 'figure-card';
          topline.appendChild(createStackedBarFigure(figures?.support?.topline?.segments));
          topline.appendChild(
            createMetricChips([
              { label: 'Support', value: '58%' },
              { label: 'Oppose', value: '30%' },
              { label: 'Net support', value: '+28pp' }
            ])
          );
          shell.body.appendChild(topline);
          shell.body.appendChild(
            createLollipopList(
              toArray(figures?.support?.regions).map((row) => ({ label: row.label, value: row.support })),
              {
                min: 50,
                max: 65,
                valueFormatter: (value) => formatPercent(value, 1)
              }
            )
          );
          return shell.section;
        }

        if (key === 'support_demographic_with_view') {
          const partyRows = toArray(figures?.support?.party_support_display?.rows).map((row) => [
            row.label,
            `${Math.round(Number(row.support))}%`,
            `${Math.round(Number(row.oppose))}%`,
            formatSignedWhole(row.net),
          ]);
          shell.body.appendChild(createTable(['Party', 'Support', 'Oppose', 'Net'], partyRows));
          return shell.section;
        }

        if (key === 'gambling_behavior_offshore_awareness') {
          shell.body.classList.add('two-up');
          shell.body.appendChild(
            createMeterListCard(
              '',
              [
                { label: 'Gambled in past year', value: figures?.attitudes?.participation?.gambled_last_year },
                { label: 'Did not gamble', value: figures?.attitudes?.participation?.did_not_gamble }
              ],
              (value) => formatPercent(value, 0)
            )
          );
          shell.body.appendChild(
            createMeterListCard(
              '',
              toArray(figures?.attitudes?.offshore_awareness),
              (value) => formatPercent(value, 0)
            )
          );
          return shell.section;
        }

        if (key === 'belief_landscape') {
          shell.body.appendChild(createDivergingCard('', figures?.attitudes?.beliefs));
          return shell.section;
        }

        if (key === 'argument_matchups') {
          shell.body.appendChild(createMatchupCard(figures?.attitudes?.argument_matchups));
          return shell.section;
        }

        if (key === 'persuadability_bars') {
          shell.body.appendChild(
            createMeterListCard(
              '',
              toArray(figures?.attitudes?.intensity),
              (value) => formatPercent(value, 0)
            )
          );
          return shell.section;
        }

        if (key === 'priorities_and_revenue_uses') {
          shell.body.appendChild(
            createMeterListCard(
              '',
              toArray(figures?.attitudes?.revenue_priorities),
              (value) => formatPercent(value, 0)
            )
          );
          return shell.section;
        }

        const fallback = document.createElement('section');
        fallback.className = 'figure-card';
        fallback.textContent = String(block?.marker || '').replace(/^Insert\s+[Cc]hart\s*->\s*/, '');
        shell.body.appendChild(fallback);
        return shell.section;
      }

      function splitReportBlocks(blocks) {
        const items = toArray(blocks);
        const titleIndex = items.findIndex((block) => block?.type === 'heading' && Number(block?.level) === 1);
        const firstRuleIndex = items.findIndex((block, index) => index > titleIndex && block?.type === 'rule');
        return {
          titleBlock: titleIndex >= 0 ? items[titleIndex] : null,
          headerBlocks: titleIndex >= 0 && firstRuleIndex > titleIndex ? items.slice(titleIndex + 1, firstRuleIndex) : [],
          bodyBlocks: firstRuleIndex >= 0 ? items.slice(firstRuleIndex + 1) : items
        };
      }

      function renderHeader(blocks) {
        const container = document.getElementById('reportHeader');
        if (!container) return;
        container.innerHTML = '';
        const split = splitReportBlocks(blocks);

        const title = document.createElement('h1');
        title.className = 'report-title';
        title.id = 'reportTitle';
        title.textContent = split.titleBlock?.text || reportData?.meta?.title || 'Louisiana iGaming public opinion analysis';
        container.appendChild(title);

        const copy = document.createElement('div');
        copy.className = 'report-header-copy';
        toArray(split.headerBlocks).forEach((block) => {
          if (block?.type !== 'paragraph') return;
          const p = document.createElement('p');
          p.className = 'report-paragraph';
          p.setAttribute('data-report-text-block', 'true');
          p.innerHTML = renderParagraphHtml(block.lines);
          copy.appendChild(p);
        });
        container.appendChild(copy);
      }

      function createHeadingNode(block) {
        const level = Number(block?.level || 2);
        const nodeName = level <= 1 ? 'h2' : level === 2 ? 'h3' : 'h4';
        const heading = document.createElement(nodeName);
        heading.id = `section-${normalizeHeadingId(block?.text || '')}`;
        heading.textContent = block?.text || '';
        heading.setAttribute('data-report-heading', 'true');
        if (level <= 1) heading.className = 'report-heading-major';
        else if (level === 2) heading.className = 'report-heading-section';
        else heading.className = 'report-heading-subsection';
        return heading;
      }

      function renderBody(blocks) {
        const container = document.getElementById('reportBody');
        if (!container) return;
        container.innerHTML = '';
        const split = splitReportBlocks(blocks);
        const bodyBlocks = toArray(split.bodyBlocks);

        for (let index = 0; index < bodyBlocks.length; index += 1) {
          const block = bodyBlocks[index];
          const nextBlock = bodyBlocks[index + 1];
          if (!block || typeof block !== 'object') continue;
          if (block.type === 'heading') {
            container.appendChild(createHeadingNode(block));
            continue;
          }
          if (block.type === 'paragraph') {
            const p = document.createElement('p');
            p.className = 'report-paragraph';
            p.setAttribute('data-report-text-block', 'true');
            p.innerHTML = renderParagraphHtml(block.lines);
            container.appendChild(p);
            continue;
          }
          if (block.type === 'table') {
            container.appendChild(createTable(block.headers, block.rows));
            continue;
          }
          if (block.type === 'list') {
            const list = document.createElement(block.ordered ? 'ol' : 'ul');
            list.className = 'report-list';
            list.setAttribute('data-report-text-block', 'true');
            toArray(block.items).forEach((item) => {
              const li = document.createElement('li');
              li.innerHTML = renderInlineMarkdown(item);
              list.appendChild(li);
            });
            container.appendChild(list);
            continue;
          }
          if (block.type === 'quote') {
            const quote = document.createElement('blockquote');
            quote.className = 'report-quote';
            quote.setAttribute('data-report-text-block', 'true');
            quote.innerHTML = `<p>${renderParagraphHtml(block.lines)}</p>`;
            container.appendChild(quote);
            continue;
          }
          if (block.type === 'rule') {
            const hr = document.createElement('hr');
            hr.className = 'report-divider';
            container.appendChild(hr);
            continue;
          }
          if (block.type === 'figure_marker') {
            container.appendChild(renderFigureBlock(block, nextBlock));
          }
        }
      }

      function handleEmbedMessage(event) {
        const data = event?.data;
        if (!data || data.type !== 'vdh-test-ballot-embed-height' || data.embed !== 'statewide-comparison') return;
        const frame = document.querySelector('iframe[data-embed-kind="test-ballot-statewide-comparison"]');
        const nextHeight = Number(data?.height);
        if (!frame || !Number.isFinite(nextHeight) || nextHeight <= 0) return;
        frame.style.height = `${Math.max(320, Math.ceil(nextHeight))}px`;
      }

      async function renderReport() {
        const blocks = toArray(reportData?.report_blocks);
        renderHeader(blocks);
        renderBody(blocks);
        applyThemeToLinks(document);
        applyThemeToEmbeds(document);
        if (pendingAsyncWork.length) {
          await Promise.allSettled(pendingAsyncWork.splice(0));
        }
      }

      document.addEventListener('DOMContentLoaded', async () => {
        window.addEventListener('message', handleEmbedMessage);
        initThemeControls();
        await loadReportData();
        renderSiteNavigation();
        await renderReport();
      });
    </script>
  </body>
</html>
